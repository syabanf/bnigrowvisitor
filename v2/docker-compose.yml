services:
  db:
    image: postgres:17-alpine
    container_name: bni-v2-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bni_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bni_visitor}
    ports:
      - "${DB_PORT:-5440}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # No init-hook mount: the API applies migrations itself at startup, so a
      # schema change reaches an existing database instead of only a fresh one.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bni} -d ${POSTGRES_DB:-bni_visitor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bni-v2-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-bni}:${POSTGRES_PASSWORD:-bni_dev_password}@db:5432/${POSTGRES_DB:-bni_visitor}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diset — lihat .env.example}
      # Every origin the app is actually served from. Missing one here blocks
      # the real users, not an attacker — the SPA origin must be listed.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8095,http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8095}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
      # The AI assistant. Optional: without a key it answers from the figures
      # rather than refusing, so leaving these unset degrades the feature
      # instead of breaking it. The base URL is a variable because the
      # chat-completions shape is shared — DeepSeek, OpenAI, Groq, a local
      # server — and which one an operator can reach is not a code decision.
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      ASSISTANT_NAME: ${ASSISTANT_NAME:-Grow Assistant}
      # Quick sign-in on the login screen. This compose file is the demo and
      # development stack, so it is on here; a real deployment leaves it unset,
      # and the endpoint answers 404 rather than listing working credentials.
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo123}
      # Pool size. Raise with the database, not with the traffic: measured at
      # 10, 25 and 50 under identical load, throughput did not improve.
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
    depends_on:
      # Waits for the healthcheck, not just for the container to exist —
      # otherwise the API races the schema and exits on a failed ping.
      db:
        condition: service_healthy
    ports:
      # Bound to the loopback interface, not 0.0.0.0. The API is meant to be
      # reached through nginx, which overwrites X-Real-IP with the address it
      # actually saw; a direct caller can set that header themselves, and with
      # it choose which bucket the per-IP rate limiter counts them in. Keeping
      # the port on localhost leaves it available for debugging without
      # publishing that bypass to the network.
      - "127.0.0.1:${API_PORT:-8090}:8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bni-v2-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8095}:80"
    restart: unless-stopped

  # TLS variant. Same image, different config mounted over the default, so the
  # two cannot drift. Needs certificates in ./frontend/tls before it will start:
  #
  #   docker compose --profile tls up -d web-tls
  #
  # Kept behind a profile because a compose file that fails on a missing
  # certificate is a worse first run than plain HTTP on localhost.
  web-tls:
    profiles: ["tls"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bni-v2-web-tls
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./frontend/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/tls:/etc/nginx/tls:ro
      - certbot_webroot:/var/www/certbot
    restart: unless-stopped

  # Scheduled logical backup. Behind a profile because a dump loop is noise in
  # development, and because where backups are stored is a deployment decision
  # rather than something a compose file should assume:
  #
  #   docker compose --profile backup up -d backup
  #
  # The same postgres image as the server, so pg_dump matches its version — an
  # older client can produce a dump that fails to restore, and an incident is
  # the wrong time to find that out.
  backup:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-bni}
      POSTGRES_DB: ${POSTGRES_DB:-bni_visitor}
      # Read by pg_dump and psql from the environment rather than passed on the
      # command line, where it would be visible to anyone running ps.
      PGPASSWORD: ${POSTGRES_PASSWORD:-bni_dev_password}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./ops:/ops:ro
      - db_backups:/backups
    entrypoint: ["/bin/sh", "/ops/backup.sh"]
    profiles: ["backup"]
    restart: unless-stopped

volumes:
  db_data:
  certbot_webroot:
  # A named volume, not a bind mount: the point is that it survives a
  # `docker compose down`, which removes containers but leaves named volumes.
  db_backups:
