services:
  db:
    image: postgres:17-alpine
    container_name: bni-v2-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bni_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bni_visitor}
    ports:
      - "${DB_PORT:-5440}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # No init-hook mount: the API applies migrations itself at startup, so a
      # schema change reaches an existing database instead of only a fresh one.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bni} -d ${POSTGRES_DB:-bni_visitor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bni-v2-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-bni}:${POSTGRES_PASSWORD:-bni_dev_password}@db:5432/${POSTGRES_DB:-bni_visitor}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diset — lihat .env.example}
      # Every origin the app is actually served from. Missing one here blocks
      # the real users, not an attacker — the SPA origin must be listed.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8095,http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8095}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
    depends_on:
      # Waits for the healthcheck, not just for the container to exist —
      # otherwise the API races the schema and exits on a failed ping.
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8090}:8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bni-v2-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8095}:80"
    restart: unless-stopped

volumes:
  db_data:
