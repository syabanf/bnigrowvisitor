server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Same-origin proxy: the session cookie stays first-party, so no CORS and no
  # third-party-cookie blocking in the browser.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed assets are immutable; the entry HTML must never be cached or clients
  # keep loading a stale bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
