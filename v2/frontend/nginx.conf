server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The SPA needs its own bundle and same-origin XHR, nothing else. Locking the
  # CSP down here is what turns a stored-XSS bug from "attacker runs code with
  # the victim's session" into "the injected script cannot load or phone home".
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # Nothing in this app needs a camera, a microphone or a location.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # The version banner tells a scanner exactly which CVEs to try.
  server_tokens off;

  # Same-origin proxy: the session cookie stays first-party, so no CORS and no
  # third-party-cookie blocking in the browser.
  # nginx's default client_max_body_size is 1 MB, which silently capped the CSV
  # import well below the 5 MB the handler advertises — and returned an nginx
  # HTML error page instead of the app's JSON. Tight everywhere, generous only
  # where a large body is legitimate.
  client_max_body_size 1m;

  location = /api/import/visitors {
    client_max_body_size 6m;   # a little above the handler's own 5 MB cap
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The machine-facing API. Separate location so it is not caught by the SPA
  # fallback below.
  location /external/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:8080;
    # gzip_proxied above only applies once the response reaches nginx; the
    # upstream must not pre-compress, and nginx must be told the version
    # supports it or it silently skips compression for proxied responses.
    proxy_http_version 1.1;
    proxy_set_header Accept-Encoding "";
    # $http_host, not $host: $host drops the port, and tenant resolution matches
    # on the full authority (localhost:8095 is a different tenant key from
    # localhost).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Compression. The JS bundle is ~226 KB raw and ~68 KB gzipped, so this is
  # the single biggest transfer win available — most of it is text.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  # Level 6 is the usual knee: level 9 costs noticeably more CPU for around 1%
  # smaller output.
  gzip_comp_level 6;
  # Below ~1 KB the gzip header and CPU outweigh the saving.
  gzip_min_length 1024;
  gzip_types
    text/plain text/css text/xml
    application/javascript application/json application/manifest+json
    application/xml image/svg+xml;

  # nginx's bundled mime.types predates .webmanifest, so without this the
  # manifest is served as application/octet-stream and some browsers refuse it.
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
  }

  # The service worker must never be cached, or a client keeps running the old
  # one and never picks up a new version.
  location = /sw.js {
    types { } default_type application/javascript;
    add_header Cache-Control "no-cache" always;
  }

  # Hashed assets are immutable; the entry HTML must never be cached or clients
  # keep loading a stale bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
