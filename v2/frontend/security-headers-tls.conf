# The TLS variant of the header set: the same policy, plus HSTS.
#
# HSTS lives only here. A browser that has seen it refuses plain HTTP to this
# host for a year, so sending it from the HTTP config would lock users out of a
# deployment whose certificate is not ready yet.
include /etc/nginx/security-headers.conf;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
