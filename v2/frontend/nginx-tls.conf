# TLS-terminating configuration.
#
# Not the default: it needs certificates, and a compose file that fails without
# them is a worse first-run experience than plain HTTP on localhost. Enable it
# with the `tls` profile once certificates exist:
#
#   docker compose --profile tls up -d
#
# For a real deployment, put certbot in front or terminate at a load balancer
# and keep this file as the reference for the headers that must be set.

server {
    listen 80;
    server_name _;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP, or
    # renewal fails and the site goes down when the certificate expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 is the floor: 1.0 and 1.1 are deprecated and fail most audits.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS. Only meaningful once the certificate is real and renewal is
    # automated — a browser that has seen this header refuses plain HTTP for a
    # year, so shipping it with a broken certificate locks users out.
    include /etc/nginx/security-headers-tls.conf;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

    client_max_body_size 1m;

    location = /manifest.webmanifest { types { } default_type application/manifest+json; }
    location = /sw.js {
        types { } default_type application/javascript;
        include /etc/nginx/security-headers-tls.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /api/import/visitors {
        client_max_body_size 6m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        include /etc/nginx/proxy-headers.conf;
    }

    location /external/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        include /etc/nginx/proxy-headers.conf;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        include /etc/nginx/proxy-headers.conf;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/security-headers-tls.conf;
        add_header Cache-Control "public, immutable";
    }

    # Editor swap files, VCS metadata and stray dotfiles are never part of a
    # build, but the SPA fallback would answer 200 with index.html for any of
    # them. The ACME challenge path is exempt: it lives under a dotted
    # directory, and denying it would break certificate renewal.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers-tls.conf;
        add_header Cache-Control "no-cache";
    }
}
