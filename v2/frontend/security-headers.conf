# Security headers, in an include rather than inline.
#
# nginx does not merge add_header across levels: a location that declares even
# one add_header of its own discards every add_header inherited from the server
# block. The headers below were defined once at server level and looked correct
# on review, while the locations that set their own Cache-Control — the SPA
# entry point and every hashed asset — silently served no CSP at all.
#
# Including this file wherever a location adds a header of its own is what keeps
# the two from drifting apart again.

# The SPA needs its own bundle and same-origin XHR, nothing else. Locking the
# CSP down here is what turns a stored-XSS bug from "attacker runs code with the
# victim's session" into "the injected script cannot load or phone home".
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Nothing in this app needs a camera, a microphone or a location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
