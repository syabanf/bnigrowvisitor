<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — BNI Visitor Management</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem calc(1.5rem + env(safe-area-inset-right)) 2rem calc(1.5rem + env(safe-area-inset-left));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8f8fa;
        color: #1d1d1f;
        text-align: center;
      }
      .card {
        max-width: 24rem;
        background: #fff;
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.1);
      }
      img { width: 72px; height: 72px; margin-bottom: 1.25rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: #6e6e73; line-height: 1.55; font-size: 0.95rem; }
      button {
        border: 0;
        border-radius: 0.85rem;
        padding: 0.8rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 700;
        color: #fff;
        background: #d9173b;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="BNI" />
      <h1>Tidak ada koneksi</h1>
      <p>Aplikasi butuh internet untuk memuat data visitor dan member. Cek koneksi kamu, lalu coba lagi.</p>
      <button onclick="location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
